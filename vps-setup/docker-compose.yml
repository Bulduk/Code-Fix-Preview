version: "3.9"

# ─────────────────────────────────────────────────────────────────────────────
# Nexus Trade OS — Production Docker Compose
# Servisler: postgres · redis · api-server · frontend · nginx
# Opsiyonel: barter (Rust) · nautilus (Python)
# ─────────────────────────────────────────────────────────────────────────────

services:

  # ── PostgreSQL 16 ──────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: nexus_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER:     nexus
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB:       nexusdb
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nexus -d nexusdb"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Redis 7 (tick cache + rate limit) ─────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: nexus_redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD} --maxmemory 256mb --maxmemory-policy allkeys-lru
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── API Server (Node.js / Express + WS Hub) ────────────────────────────────
  api:
    build:
      context: ..
      dockerfile: artifacts/api-server/Dockerfile
    container_name: nexus_api
    restart: unless-stopped
    environment:
      NODE_ENV:          production
      PORT:              8080
      DATABASE_URL:      postgresql://nexus:${POSTGRES_PASSWORD}@postgres:5432/nexusdb
      SESSION_SECRET:    ${SESSION_SECRET}
      OKX_API_KEY:       ${OKX_API_KEY:-}
      OKX_SECRET:        ${OKX_SECRET:-}
      OKX_PASSPHRASE:    ${OKX_PASSPHRASE:-}
      BINANCE_API_KEY:   ${BINANCE_API_KEY:-}
      BINANCE_SECRET:    ${BINANCE_SECRET:-}
      BYBIT_API_KEY:     ${BYBIT_API_KEY:-}
      BYBIT_SECRET:      ${BYBIT_SECRET:-}
      TRADE_MODE:        ${TRADE_MODE:-paper}
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/api/healthz || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5

  # ── Frontend (React SPA — nginx static) ────────────────────────────────────
  frontend:
    build:
      context: ..
      dockerfile: artifacts/nexus-trade-os/Dockerfile
    container_name: nexus_frontend
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - api
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/healthz || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3

  # ── Nginx Reverse Proxy (80 + 443) ────────────────────────────────────────
  nginx:
    image: nginx:alpine
    container_name: nexus_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nexus.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - nginx_logs:/var/log/nginx
    depends_on:
      - api
      - frontend
    healthcheck:
      test: ["CMD-SHELL", "nginx -t && wget -qO- http://localhost/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ── Barter-rs Risk Engine (Rust) — OPSİYONEL ─────────────────────────────
  barter:
    build:
      context: ./barter-rs
      dockerfile: Dockerfile
    container_name: nexus_barter
    restart: unless-stopped
    environment:
      RUST_LOG:     info
      REDIS_URL:    redis://:${REDIS_PASSWORD}@redis:6379
      DATABASE_URL: postgresql://nexus:${POSTGRES_PASSWORD}@postgres:5432/nexusdb
      BARTER_PORT:  8090
    ports:
      - "127.0.0.1:8090:8090"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    profiles:
      - full

  # ── Nautilus Trader Orchestrator (Python) — OPSİYONEL ────────────────────
  nautilus:
    build:
      context: ./nautilus
      dockerfile: Dockerfile
    container_name: nexus_nautilus
    restart: unless-stopped
    environment:
      DATABASE_URL:       postgresql://nexus:${POSTGRES_PASSWORD}@postgres:5432/nexusdb
      REDIS_URL:          redis://:${REDIS_PASSWORD}@redis:6379
      BARTER_URL:         http://barter:8090
      OKX_API_KEY:        ${OKX_API_KEY:-}
      OKX_SECRET:         ${OKX_SECRET:-}
      OKX_PASSPHRASE:     ${OKX_PASSPHRASE:-}
      BINANCE_API_KEY:    ${BINANCE_API_KEY:-}
      BINANCE_SECRET:     ${BINANCE_SECRET:-}
      BYBIT_API_KEY:      ${BYBIT_API_KEY:-}
      BYBIT_SECRET:       ${BYBIT_SECRET:-}
      ANTHROPIC_API_KEY:  ${ANTHROPIC_API_KEY:-}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID:   ${TELEGRAM_CHAT_ID:-}
      TRADE_MODE:         ${TRADE_MODE:-paper}
      NAUTILUS_PORT:      8091
    ports:
      - "127.0.0.1:8091:8091"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - nautilus_data:/app/data
    profiles:
      - full

volumes:
  pgdata:
  nautilus_data:
  nginx_logs:
