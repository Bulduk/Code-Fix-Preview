version: "3.9"

services:
  # ── PostgreSQL 16 ──────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: nexus_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER:     nexus
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB:       nexusdb
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nexus -d nexusdb"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Redis (tick cache + rate limit) ───────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: nexus_redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD} --maxmemory 256mb --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Barter-rs Risk Engine (Docker) ────────────────────────────────────────
  barter:
    build:
      context: ./barter-rs
      dockerfile: Dockerfile
    container_name: nexus_barter
    restart: unless-stopped
    environment:
      RUST_LOG:         info
      REDIS_URL:        redis://:${REDIS_PASSWORD}@redis:6379
      DATABASE_URL:     postgresql://nexus:${POSTGRES_PASSWORD}@postgres:5432/nexusdb
      BARTER_PORT:      8090
    ports:
      - "8090:8090"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ── Nautilus Trader Orchestrator ──────────────────────────────────────────
  nautilus:
    build:
      context: ./nautilus
      dockerfile: Dockerfile
    container_name: nexus_nautilus
    restart: unless-stopped
    environment:
      DATABASE_URL:          postgresql://nexus:${POSTGRES_PASSWORD}@postgres:5432/nexusdb
      REDIS_URL:             redis://:${REDIS_PASSWORD}@redis:6379
      BARTER_URL:            http://barter:8090
      OKX_API_KEY:           ${OKX_API_KEY}
      OKX_SECRET:            ${OKX_SECRET}
      OKX_PASSPHRASE:        ${OKX_PASSPHRASE}
      BINANCE_API_KEY:       ${BINANCE_API_KEY}
      BINANCE_SECRET:        ${BINANCE_SECRET}
      BYBIT_API_KEY:         ${BYBIT_API_KEY}
      BYBIT_SECRET:          ${BYBIT_SECRET}
      ANTHROPIC_API_KEY:     ${ANTHROPIC_API_KEY}
      TELEGRAM_BOT_TOKEN:    ${TELEGRAM_BOT_TOKEN}
      TELEGRAM_CHAT_ID:      ${TELEGRAM_CHAT_ID}
      TRADE_MODE:            ${TRADE_MODE:-paper}
      NAUTILUS_PORT:         8091
    ports:
      - "8091:8091"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      barter:
        condition: service_started
    volumes:
      - ./nautilus/strategies:/app/strategies:ro
      - nautilus_data:/app/data

  # ── Nginx Reverse Proxy ───────────────────────────────────────────────────
  nginx:
    image: nginx:alpine
    container_name: nexus_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nexus.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - barter
      - nautilus

volumes:
  pgdata:
  nautilus_data:
