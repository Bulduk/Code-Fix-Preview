[package]
name    = "nexus-barter"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "nexus-barter"
path = "src/main.rs"

[dependencies]
# Barter-rs — modüler trading framework
barter             = { git = "https://github.com/barter-rs/barter-rs", branch = "main" }
barter-data        = { git = "https://github.com/barter-rs/barter-rs", branch = "main" }
barter-execution   = { git = "https://github.com/barter-rs/barter-rs", branch = "main" }

# Async runtime
tokio    = { version = "1", features = ["full"] }

# HTTP API (REST endpoint)
axum     = { version = "0.7", features = ["json", "ws"] }
tower    = "0.4"
tower-http = { version = "0.5", features = ["cors"] }

# Serialization
serde       = { version = "1", features = ["derive"] }
serde_json  = "1"

# DB
sqlx = { version = "0.7", features = ["runtime-tokio-rustls", "postgres", "chrono", "uuid"] }

# Redis
redis = { version = "0.25", features = ["tokio-comp"] }

# Logging
tracing            = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Utils
uuid    = { version = "1", features = ["v4"] }
chrono  = { version = "0.4", features = ["serde"] }
anyhow  = "1"
