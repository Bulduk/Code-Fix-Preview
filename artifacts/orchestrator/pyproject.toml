[project]
name = "nexus-orchestrator"
version = "0.1.0"
description = "LangGraph tabanlı ticaret orkestratörü — Claude + Gemini + Rust Risk"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "langgraph>=0.2.0",
  "langchain-core>=0.3.0",
  "anthropic>=0.40.0",
  "google-generativeai>=0.8.0",
  "httpx>=0.27.0",
  "pydantic>=2.9.0",
  "pydantic-settings>=2.6.0",
  "structlog>=24.4.0",
  "python-telegram-bot>=21.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
